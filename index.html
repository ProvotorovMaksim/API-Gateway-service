<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система анализа проблем</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- ЕДИНЫЙ ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="flex mb-6 border-b">
            <button id="tab-login" class="flex-1 pb-2 text-center font-medium text-blue-600 border-b-2 border-blue-600 transition">Вход</button>
            <button id="tab-register" class="flex-1 pb-2 text-center font-medium text-gray-500 hover:text-gray-700 transition">Регистрация</button>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Логин</label>
                <input type="text" id="login-username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Пароль</label>
                <input type="password" id="login-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <p id="login-error" class="text-red-600 text-sm hidden"></p>
            <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium transition">Войти</button>
        </form>

        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700">Логин</label>
                <input type="text" id="reg-username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="reg-email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Пароль</label>
                <input type="password" id="reg-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <p id="reg-error" class="text-red-600 text-sm hidden"></p>
            <button type="submit" class="w-full py-2 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium transition">Зарегистрироваться</button>
        </form>
    </div>

    <!-- ЕДИНЫЙ ЭКРАН ДАШБОРДА -->
    <div id="dashboard-screen" class="hidden max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-gray-800">Мониторинг проблем и лидов</h1>
            <div class="flex flex-wrap gap-2">
                <!-- ИСПРАВЛЕНЫ ПУТИ: добавлен префикс /api/problem-service/ -->
                <button onclick="triggerAction('/api/problem-service/', 'Пайплайн парсинга запущен')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm font-medium">Запустить парсинг</button>
                <button onclick="triggerAction('/api/problem-service/normalize-problems', 'Нормализация запущена')" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition text-sm font-medium">Нормализовать</button>
                <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm font-medium">Обновить таблицу</button>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition text-sm font-medium">Выйти</button>
            </div>
        </div>
        <div id="status-msg" class="hidden mb-4 p-3 rounded border text-sm"></div>
        <div id="loading" class="text-center text-gray-500 py-10">Загрузка данных...</div>
        <div id="problems-container" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authScreen = document.getElementById('auth-screen');
            const dashboardScreen = document.getElementById('dashboard-screen');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            tabLogin.addEventListener('click', () => {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                tabLogin.classList.remove('text-gray-500');
                tabRegister.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                tabRegister.classList.add('text-gray-500');
            });

            tabRegister.addEventListener('click', () => {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabRegister.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                tabRegister.classList.remove('text-gray-500');
                tabLogin.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                tabLogin.classList.add('text-gray-500');
            });

            if (localStorage.getItem('auth_token')) {
                showDashboard();
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errorMsg = document.getElementById('login-error');
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: document.getElementById('login-username').value,
                            password: document.getElementById('login-password').value
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('auth_token', data.access_token || data.token);
                        showDashboard();
                    } else {
                        const err = await response.json();
                        errorMsg.innerText = err.detail || "Ошибка входа";
                        errorMsg.classList.remove('hidden');
                    }
                } catch (error) {
                    errorMsg.innerText = "Ошибка соединения";
                    errorMsg.classList.remove('hidden');
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errorMsg = document.getElementById('reg-error');
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: document.getElementById('reg-username').value,
                            email: document.getElementById('reg-email').value,
                            password: document.getElementById('reg-password').value
                        })
                    });
                    if (response.ok) {
                        alert("Регистрация успешна. Войдите в систему.");
                        tabLogin.click();
                        registerForm.reset();
                    } else {
                        const err = await response.json();
                        errorMsg.innerText = Array.isArray(err.detail) ? err.detail.map(e => e.msg).join(', ') : (err.detail || "Ошибка регистрации");
                        errorMsg.classList.remove('hidden');
                    }
                } catch (error) {
                    errorMsg.innerText = "Ошибка соединения";
                    errorMsg.classList.remove('hidden');
                }
            });

            function showDashboard() {
                authScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center');
                document.body.classList.add('items-start', 'pt-10');
                loadData();
            }

            // ИСПРАВЛЕННАЯ ФУНКЦИЯ ДЕЙСТВИЙ
            window.triggerAction = async function(endpoint, successMsg) {
                const token = localStorage.getItem('auth_token');
                const msgBox = document.getElementById('status-msg');
                
                msgBox.innerText = "Выполняется запрос...";
                msgBox.className = "mb-4 p-3 bg-blue-100 text-blue-800 rounded border border-blue-200 text-sm";
                msgBox.classList.remove('hidden');

                try {
                    console.log(`Отправка запроса на: ${endpoint}`);
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}` // <-- ДОБАВЛЕН ТОКЕН
                        }
                    });

                    console.log(`Ответ сервера: ${response.status}`);

                    if (response.ok) {
                        msgBox.innerText = `✅ ${successMsg}`;
                        msgBox.className = "mb-4 p-3 bg-green-100 text-green-800 rounded border border-green-200 text-sm";
                        setTimeout(() => msgBox.classList.add('hidden'), 5000);
                        // Автоматически обновляем таблицу после действия
                        setTimeout(() => loadData(), 2000); 
                    } else {
                        const errText = await response.text();
                        console.error("Ошибка сервера:", response.status, errText);
                        msgBox.innerText = `❌ Ошибка: ${response.status}. Проверь консоль (F12)`;
                        msgBox.className = "mb-4 p-3 bg-red-100 text-red-800 rounded border border-red-200 text-sm";
                    }
                } catch (error) {
                    console.error("Ошибка сети:", error);
                    msgBox.innerText = "❌ Ошибка соединения с сервером";
                    msgBox.className = "mb-4 p-3 bg-red-100 text-red-800 rounded border border-red-200 text-sm";
                }
            }

            async function loadData() {
                const token = localStorage.getItem('auth_token');
                const container = document.getElementById('problems-container');
                const loading = document.getElementById('loading');
                
                loading.classList.remove('hidden');
                container.innerHTML = '';

                try {
                    console.log("Загрузка данных с токеном...");
                    const response = await fetch('/api/problem-service/top-problems-with-leads', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    console.log("Статус загрузки данных:", response.status);

                    if (response.status === 401) { 
                        console.warn("Токен недействителен, выход из системы");
                        logout(); 
                        return; 
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    console.log("Получено записей:", data.length);
                    
                    if (data.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">Данных пока нет. Нажмите "Запустить парсинг" и подождите 10-20 секунд.</p>';
                    } else {
                        data.forEach(item => {
                            const card = document.createElement('div');
                            card.className = 'bg-white p-6 rounded-lg shadow-md border border-gray-200 hover:shadow-lg transition';
                            const linksHtml = item.leads && item.leads.length > 0 
                                ? item.leads.map(link => `<a href="${link}" target="_blank" class="block text-blue-600 hover:text-blue-800 hover:underline text-sm mb-2 truncate" title="${link}">🔗 ${link.split('/').pop().substring(0, 40)}...</a>`).join('')
                                : '<span class="text-gray-400 text-sm">Ссылки отсутствуют</span>';
                            card.innerHTML = `
                                <div class="flex justify-between items-start mb-4">
                                    <h2 class="text-lg font-semibold text-gray-900 leading-tight">${item.problem}</h2>
                                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap ml-2">${item.mentions}</span>
                                </div>
                                <div class="border-t pt-3 space-y-1">${linksHtml}</div>
                            `;
                            container.appendChild(card);
                        });
                    }
                } catch (error) {
                    console.error("Критическая ошибка загрузки:", error);
                    container.innerHTML = '<p class="text-red-500 col-span-full text-center">Ошибка загрузки данных. Откройте консоль (F12) для деталей.</p>';
                } finally {
                    loading.classList.add('hidden');
                }
            }

            window.logout = function() {
                localStorage.removeItem('auth_token');
                location.reload();
            }
            window.loadData = loadData;
        });
    </script>
</body>
</html>
